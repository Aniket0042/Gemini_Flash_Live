<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Flash Live</title>
  <meta name="description" content="Simple, elegant real-time voice, video, and screen assistant powered by Gemini 3.1 Flash Live.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="dark-theme">

  <!-- TOP NAVIGATION BAR -->
  <header class="navbar">
    <div class="nav-brand">
      <div class="gemini-spark">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M12 0C12 6.627 6.627 12 0 12C6.627 12 12 17.373 12 24C12 17.373 17.373 12 24 12C17.373 12 12 6.627 12 0Z" fill="url(#sparkGrad)"/>
          <defs>
            <linearGradient id="sparkGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
              <stop stop-color="#4285F4"/>
              <stop offset="0.5" stop-color="#9B72CB"/>
              <stop offset="1" stop-color="#D96570"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <span class="brand-title">Gemini Live</span>
      <span class="model-badge" id="header-model-badge">3.1 Flash</span>
    </div>

    <!-- Live Connection & Audio Activity -->
    <div class="nav-center">
      <div id="connection-status-pill" class="status-pill status-disconnected">
        <span class="status-dot"></span>
        <span id="status-text">Connecting...</span>
      </div>

      <div id="live-audio-indicator" class="live-audio-pulse hidden" title="Audio streaming">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </div>
    </div>

    <!-- Header Actions -->
    <div class="nav-actions">
      <!-- Quick Voice Switcher -->
      <div class="voice-pill">
        <span class="voice-icon">🎙️</span>
        <select id="select-voice" class="voice-select" title="Change Voice">
          <option value="Achird" selected>Achird</option>
          <option value="Gacrux">Gacrux</option>
          <option value="Pulcherrima">Pulcherrima</option>
          <option value="Zubenelgenubi">Zubenelgenubi</option>
          <option value="Vindemiatrix">Vindemiatrix</option>
          <option value="Zephyr">Zephyr</option>
          <option value="Puck">Puck</option>
          <option value="Charon">Charon</option>
          <option value="Aoede">Aoede</option>
          <option value="Fenrir">Fenrir</option>
          <option value="Kore">Kore</option>
          <option value="Pegasus">Pegasus</option>
        </select>
      </div>

      <!-- Clear Chat -->
      <button id="btn-clear-chat" class="icon-action-btn" title="Reset Session">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
        </svg>
      </button>

      <!-- Settings Drawer Toggle -->
      <button id="toggle-settings-btn" class="icon-action-btn" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- MAIN VIEWPORT -->
  <main class="main-viewport">
    
    <!-- Floating Video / Screen Picture-in-Picture -->
    <div id="pip-video-container" class="pip-box hidden">
      <div class="pip-bar">
        <span id="pip-mode-label" class="pip-title">● LIVE CAMERA</span>
        <button id="pip-close-btn" class="pip-btn" title="Stop Video">✕</button>
      </div>
      <div class="pip-video-wrapper">
        <video id="pip-video-element" autoplay playsinline muted></video>
      </div>
    </div>

    <!-- Chat / Turns Canvas -->
    <div id="turns-container" class="chat-canvas">
      
      <!-- Clean Welcome Hero (When empty) -->
      <div id="empty-state" class="welcome-hero">
        <div class="glowing-orb">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none">
            <path d="M12 0C12 6.627 6.627 12 0 12C6.627 12 12 17.373 12 24C12 17.373 17.373 12 24 12C17.373 12 12 6.627 12 0Z" fill="url(#heroGrad)"/>
            <defs>
              <linearGradient id="heroGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                <stop stop-color="#4285F4"/>
                <stop offset="0.5" stop-color="#9B72CB"/>
                <stop offset="1" stop-color="#D96570"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h2>Start a Live Conversation</h2>
        <p>Talk naturally, stream your camera, or share your screen. Gemini responds with ultra-low latency voice.</p>

        <div class="suggestions-row">
          <button class="suggestion-chip" data-prompt="Explain how AI works in simple terms">
            "Explain how AI works in simple terms"
          </button>
          <button class="suggestion-chip" data-prompt="Tell me an interesting science fact">
            "Tell me an interesting science fact"
          </button>
          <button class="suggestion-chip" data-prompt="What are you capable of doing in real-time?">
            "What can you do in real-time?"
          </button>
        </div>
      </div>

      <!-- Messages Stream -->
      <div id="turns-list" class="turns-stream"></div>
    </div>

    <!-- FLOATING BOTTOM CONTROL CAPSULE -->
    <div class="floating-dock">
      <div class="dock-capsule">
        
        <!-- Text Input -->
        <div class="input-wrapper">
          <textarea id="chat-input" rows="1" placeholder="Type a message or tap the mic to speak..." autofocus></textarea>
        </div>

        <!-- Prominent Microphone Button -->
        <button id="btn-toggle-mic" class="mic-primary-btn" title="Tap to Talk / Toggle Voice Stream">
          <div class="mic-ripple"></div>
          <svg class="mic-svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </button>

        <!-- Send Text Button -->
        <button id="btn-send-message" class="send-btn" title="Send message">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>

      </div>
    </div>
  </main>

  <!-- SLIDE-OVER SETTINGS DRAWER -->
  <aside id="settings-drawer" class="drawer hidden">
    <div class="drawer-header">
      <h3>Settings</h3>
      <button id="close-drawer-btn" class="icon-action-btn">✕</button>
    </div>

    <div class="drawer-body">
      <!-- Model Selection -->
      <div class="drawer-field">
        <label for="select-model">Model</label>
        <select id="select-model" class="drawer-select">
          <option value="models/gemini-3.1-flash-live-preview" selected>Gemini 3.1 Flash Live Preview</option>
          <option value="models/gemini-3.8-live">Gemini 3.8 Live Preview</option>
          <option value="models/gemini-2.5-flash-native-audio-latest">Gemini 2.5 Flash Native Audio</option>
        </select>
        <span class="field-hint">Optimized for real-time bidirectional dialogue and multimodal input.</span>
      </div>

      <!-- System Instructions -->
      <div class="drawer-field">
        <label for="system-instructions-input">System Prompt / Persona</label>
        <textarea id="system-instructions-input" class="drawer-textarea" rows="3" placeholder="e.g. You are a fast, concise conversational companion."></textarea>
      </div>

      <!-- Thinking Level -->
      <div class="drawer-field">
        <label for="select-thinking">Thinking Level</label>
        <select id="select-thinking" class="drawer-select">
          <option value="MINIMAL" selected>Minimal (Fastest)</option>
          <option value="LOW">Low</option>
          <option value="MEDIUM">Medium</option>
          <option value="HIGH">High</option>
        </select>
      </div>

      <!-- Media Resolution -->
      <div class="drawer-field">
        <label for="select-resolution">Media Resolution</label>
        <select id="select-resolution" class="drawer-select">
          <option value="MEDIA_RESOLUTION_MEDIUM" selected>Medium (Recommended)</option>
          <option value="MEDIA_RESOLUTION_HIGH">High</option>
          <option value="MEDIA_RESOLUTION_LOW">Low</option>
        </select>
      </div>

      <!-- Live Oscilloscope -->
      <div class="drawer-field">
        <label>Audio Monitor</label>
        <div class="drawer-canvas-box">
          <canvas id="waveform-canvas" width="280" height="60"></canvas>
          <div class="canvas-footer">
            <span>16kHz In • 24kHz Out</span>
            <span id="audio-active-badge" class="badge-idle">IDLE</span>
          </div>
        </div>
      </div>

      <!-- API Key Field -->
      <div class="drawer-field">
        <label for="modal-api-key-input">Gemini API Key</label>
        <div class="key-input-row">
          <input type="password" id="modal-api-key-input" placeholder="Update your API Key...">
          <button id="modal-save-btn" class="save-key-btn">Save</button>
        </div>
      </div>
    </div>
  </aside>

  <!-- Overlay Backdrop for Drawer -->
  <div id="drawer-backdrop" class="backdrop hidden"></div>

  <script src="/static/app.js"></script>
</body>
</html>
